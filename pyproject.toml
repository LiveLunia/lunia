[project]
name = "lunia"
version = "0.1.0"
description = "An autonomous AI character framework for persistent virtual companionship"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "websockets>=17.4",
]

[project.scripts]
lunia = "lunia.__main__:main"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["ref"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
norecursedirs = [".*", "build", "dist", "docs", "ref"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
